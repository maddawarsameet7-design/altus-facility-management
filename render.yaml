# ==============================================================================
# Altus Platform - Render Deployment Blueprint
# Includes Web Service and Production Staffing/Housekeeping Scheduled Cron Jobs
# ==============================================================================

services:
  # ── Web Application Service ──────────────────────────────────────────────────
  - type: web
    name: altus-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT facility_proj.asgi:application"
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: PRIVATE_STORAGE_BUCKET
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: ap-south-1
      - key: SMS_PROVIDER
        value: TWILIO
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMS_DAILY_GLOBAL_CAP
        value: "500"

  # ── Cron Job 1: Daily Staffing Roster Generation ─────────────────────────────
  - type: cron
    name: altus-cron-generate-roster
    runtime: python
    rootDir: backend
    schedule: "0 0 * * *"
    command: "python manage.py generate_roster"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

  # ── Cron Job 2: Mark Absent Shifts (Every 5 minutes) ─────────────────────────
  - type: cron
    name: altus-cron-mark-absent-shifts
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    command: "python manage.py mark_absent_shifts"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

  # ── Cron Job 3: Process Replacements & Escalation (Every 1 minute) ───────────
  - type: cron
    name: altus-cron-process-replacements
    runtime: python
    rootDir: backend
    schedule: "* * * * *"
    command: "python manage.py process_replacements"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

  # ── Cron Job 4: Daily Housekeeping Tasks Generation ──────────────────────────
  - type: cron
    name: altus-cron-generate-daily-tasks
    runtime: python
    rootDir: backend
    schedule: "0 0 * * *"
    command: "python manage.py generate_daily_tasks"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

  # ── Cron Job 5: Mark Overdue / Missed Housekeeping Tasks (Every 10 minutes) ──
  - type: cron
    name: altus-cron-mark-missed-tasks
    runtime: python
    rootDir: backend
    schedule: "*/10 * * * *"
    command: "python manage.py mark_missed_tasks"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

  # ── Cron Job 6: Cleanup Expired Private Housekeeping Photos (Weekly Sunday) ──
  # Runs with --dry-run first by default to safely evaluate photos before pruning
  - type: cron
    name: altus-cron-cleanup-expired-photos
    runtime: python
    rootDir: backend
    schedule: "0 2 * * 0"
    command: "python manage.py cleanup_expired_photos --dry-run"
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: altus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: altus-redis
          property: connectionString
      - key: OTP_HMAC_SECRET
        fromService:
          type: web
          name: altus-backend
          envVarKey: OTP_HMAC_SECRET

databases:
  - name: altus-postgres
    plan: standard
    databaseName: altus
    user: altus_user
